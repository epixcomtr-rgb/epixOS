# epixOS — Calamares yapılandırması
#
# Bu dosya canlı ortamda /etc/calamares/settings.conf olarak kurulur.
# Modül sırası Calamares 3.3.x içindir (Ubuntu noble: 3.3.5).
#
# Tasarım notları:
#   - unpackfs /cdrom/casper/filesystem.squashfs kullanır: bizim ISO
#     düzenimizle birebir uyumlu (bkz. modules/unpackfs.conf).
#   - bootloader modülünden SONRA epix-grub-guard çalışır: vga=791
#     grub.cfg'de yoksa geri yazar. Ironlake panelinde bu parametre
#     olmadan ekran siyah kalır (bkz. docs/05-KARARLAR.md #22).
#   - install tarafında networkcfg + displaymanager var; ikisi de
#     hedefe NetworkManager ve gdm3 ayarlarını taşır.

---
modules-search: [ local ]

instances:
  - id: epix-grub-guard
    module: shellprocess
    config: epix-grub-guard.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@epix-grub-guard
      - umount
  - show:
      - finished

branding: epixos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
# Kurulum surerken "geri/ileri" gizlenir (yanlislikla iptal olmasin)
hide-back-and-next-during-exec: true
# Bitis ekraninda "yeniden baslat" secenegi kalir; otomatik cikis yok
quit-at-end: false
