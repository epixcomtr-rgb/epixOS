---
# epixOS — kullanıcı hesabı.
#
# Hedef sistemde canlı kullanıcı (live) ve epix-setup kullanıcısı yoktur;
# kurulumda oluşturulan tek hesap sudo yetkisi alır.
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
  - adm
  - cdrom
  - dip
  - lpadmin
  - plugdev
  - audio
  - video
  - netdev
  - bluetooth
  - sudo
passwordRequirements:
  minLength: 1
  maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root, live ]

# Root hesabı kilitli kalır (Ubuntu geleneği); sudo ile yönetim yapılır.
