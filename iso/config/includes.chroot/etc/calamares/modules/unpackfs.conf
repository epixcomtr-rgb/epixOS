---
# epixOS — hedefe squashfs'i açar.
#
# /cdrom = canlı ortamda ISO'nun bağlı olduğu yer (casper sağlar).
# Calamares'in mount modülü /cdrom'u hedef kök altına bağlar.
# Bizim ISO'da squashfs yolu: casper/filesystem.squashfs
unpack:
  - source: "/cdrom/casper/filesystem.squashfs"
    sourcefs: "squashfs"
    destination: ""
