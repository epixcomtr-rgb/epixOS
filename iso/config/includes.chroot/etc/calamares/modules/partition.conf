---
# epixOS — bölümlendirme.
#
# Sadece ext4 sunuyoruz: hedef 2 GB RAM'li makineler, btrfs/xfs ek bellek
# ve bakım yükü getirir. "Bir bölümü sil" ve "elle" seçenekleri açık —
# B560'ta olduğu gibi mevcut bölümleri korumak gerekebilir.
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: false
luksGeneration: luks2
# GECERLI DEGERLER: none, small, suspend, file, reuse.
# "reuse" Calamares 3.3.5'te DESTEKLENMIYOR (uyari veriyor) — cikarildi.
userSwapChoices:
  - none
  - file
initialSwapChoice: file
drawNestedPartitions: true
defaultFileSystemType: "ext4"
# BIOS makinelerde msdos, UEFI'de gpt kullanilir. Acikca yazmazsak
# Calamares uyari basiyor ve otomatik secim yapiyor.
defaultPartitionTableType: "gpt"
availableFileSystemTypes: ["ext4"]

# Otomatik kurulum düzeni: tek kök bölüm (+ EFI varsa ona dokunulmaz).
partitionLayout:
  - name: "epixos_root"
    filesystem: ext4
    mountPoint: "/"
    size: 100%
