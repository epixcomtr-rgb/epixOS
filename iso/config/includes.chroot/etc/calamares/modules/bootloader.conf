---
# epixOS — GRUB kurulumu.
#
# Hem BIOS (grub-install /dev/sdX) hem UEFI (efiBootloaderId) desteklenir.
# grub-install ve grub-mkconfig HEDEF sistemde bulunmalı: ISO'ya
# grub-pc-bin + grub-efi-amd64-bin + grub2-common ile giriyor.
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
efiBootloaderId: "epixOS"
