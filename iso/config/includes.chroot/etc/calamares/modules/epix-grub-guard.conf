---
# epixOS — vga=791 güvencesi.
#
# NEDEN VAR:
#   Intel Ironlake (8086:0046, ör. Lenovo B560) panelinde vga=791 olmadan
#   çekirdek LVDS'e sinyal üretmiyor: X 1366x768 kurar, GNOME çizer,
#   arka ışık %100 olur — ama ekran SİYAH kalır.
#
#   `grub-mkconfig` / `update-grub` bu parametreyi düşürebilir. Bu modül
#   kurulumun son adımında grub.cfg'yi denetler ve eksikse GERİ YAZAR.
#
# Hem hedef kök (/) hem de canlı /cdrom'daki kopya düzeltilir: Calamares
# bitişte /cdrom'u sökebilir, o yüzden sıra umursamaz.
dontChroot: false
timeout: 120

script:
  - "sh"
  - "-c"
  - |
    set -e
    CFG=/etc/default/grub.d/99-epixos.cfg
    GRUBCFG=/boot/grub/grub.cfg

    # 1) drop-in dosyası: yoksa oluştur, varsa vga=791'i garanti et
    mkdir -p /etc/default/grub.d
    if [ ! -f "$CFG" ]; then
      cat > "$CFG" <<'EOCFG'
    GRUB_TIMEOUT=10
    GRUB_TIMEOUT_STYLE=menu
    GRUB_DISTRIBUTOR="epixOS"
    GRUB_CMDLINE_LINUX_DEFAULT="quiet splash vga=791 console=tty0"
    GRUB_CMDLINE_LINUX=""
    GRUB_GFXMODE=1024x768
    GRUB_GFXPAYLOAD_LINUX=keep
    GRUB_PRELOAD_MODULES="part_msdos ext2 all_video gfxterm vbe vga"
    EOCFG
    elif ! grep -q 'vga=791' "$CFG"; then
      # satır varsa vga=791 ekle, yoksa yeni satır yaz
      if grep -q '^GRUB_CMDLINE_LINUX_DEFAULT=' "$CFG"; then
        sed -i 's|^GRUB_CMDLINE_LINUX_DEFAULT=.*|GRUB_CMDLINE_LINUX_DEFAULT="quiet splash vga=791 console=tty0"|' "$CFG"
      else
        echo 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash vga=791 console=tty0"' >> "$CFG"
      fi
    fi

    # 2) /etc/default/grub yoksa temel dosyayı koy (grub-mkconfig bekler)
    if [ ! -f /etc/default/grub ]; then
      if [ -f /usr/share/grub/default/grub ]; then
        cp /usr/share/grub/default/grub /etc/default/grub
      else
        printf '%s\n' \
          'GRUB_DEFAULT=0' \
          'GRUB_TIMEOUT=10' \
          'GRUB_DISTRIBUTOR="epixOS"' \
          'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"' \
          'GRUB_CMDLINE_LINUX=""' > /etc/default/grub
      fi
    fi

    # 3) grub.cfg üret ve vga=791'i doğrula
    if command -v update-grub >/dev/null 2>&1; then
      update-grub >/dev/null 2>&1 || grub-mkconfig -o "$GRUBCFG" >/dev/null 2>&1 || true
    elif command -v grub-mkconfig >/dev/null 2>&1; then
      grub-mkconfig -o "$GRUBCFG" >/dev/null 2>&1 || true
    fi

    # `grep -c` iki tuzak birden tasir (ikisi de yasandi):
    #   1) `|| echo 0` YANLIS: grep -c eslesme yoksa hem "0" yazar hem
    #      exit 1 doner; "echo 0" da calisir -> degisken "0\n0" olur ->
    #      `[ "$n" -eq 0 ]` "Illegal number" verir.
    #   2) `set -e` altinda `n=$(grep -c ...)` eslesme yoksa cikis kodu 1
    #      ile betigi SESSIZCE oldurur (hic cikti gorunmez).
    # Cozum: `|| true` (cikis kodunu yut) + bos ise 0 ata.
    n=$(grep -c 'vga=791' "$GRUBCFG" 2>/dev/null || true); n=${n:-0}
    echo "epix-grub-guard: grub.cfg'de vga=791 -> $n girdi"

    # 4) Son çare: grub.cfg hâlâ eksikse linux satırlarına doğrudan ekle
    if [ "$n" -eq 0 ] && [ -f "$GRUBCFG" ]; then
      cp -f "$GRUBCFG" "${GRUBCFG}.epix-bak" 2>/dev/null || true
      sed -i -E '/^[[:space:]]*linux[[:space:]]/{
        /vga=791/!s|$| vga=791|
      }' "$GRUBCFG"
      n=$(grep -c 'vga=791' "$GRUBCFG" 2>/dev/null || true); n=${n:-0}
    echo "epix-grub-guard: elle eklendi -> $n girdi"
    fi

    exit 0
