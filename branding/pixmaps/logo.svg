<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    epixOS simgesi — kurumsal Epix logosundan türetilmiştir.
    Renkler logodan: lime #e2ff5e, navy #16404b.
    "x" süpürmesi simgeye taşınmıştır.
  -->
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#e2ff5e"/>
      <stop offset="1" stop-color="#b8d93a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4a56"/>
      <stop offset="1" stop-color="#0e2a31"/>
    </linearGradient>
  </defs>

  <!-- kutu -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none"
        stroke="#e2ff5e" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- "x" süpürmesi: logodaki ana hareket -->
  <path d="M74 170 C 108 150, 132 118, 166 74"
        fill="none" stroke="url(#lime)" stroke-width="15" stroke-linecap="round"/>
  <path d="M88 76 C 112 102, 142 136, 178 174"
        fill="none" stroke="url(#lime)" stroke-width="15" stroke-linecap="round"
        opacity="0.92"/>

  <!-- ince vurgu çizgisi -->
  <path d="M62 186 C 100 166, 128 132, 172 88"
        fill="none" stroke="#e2ff5e" stroke-opacity="0.30"
        stroke-width="3" stroke-linecap="round"/>
</svg>
